<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos | Orbe Supply</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="fornecedores">
  <div class="app">
    <aside class="lateral" id="menu"></aside>

    <main class="conteudo">
      <div class="cabecalho-pagina">
        <div>
          <h1 id="titulo">Produtos</h1>
          <p class="subtitulo" id="subtitulo"></p>
        </div>
        <div class="linha-botoes">
          <a class="botao secundario" href="fornecedores.html">Voltar</a>
          <a class="botao" id="link-novo" href="#">Novo produto</a>
        </div>
      </div>

      <div id="mensagem" class="mensagem" hidden></div>

      <div class="resumo-linha" id="resumo"></div>

      <section class="cartao tabela">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Lote</th>
              <th class="numero">Estoque</th>
              <th class="numero">Preço</th>
              <th>Fabricação</th>
              <th>Vencimento</th>
              <th>Vida útil</th>
              <th class="acoes">Ações</th>
            </tr>
          </thead>
          <tbody id="lista-produtos">
            <tr><td class="vazio" colspan="8">Carregando...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/produtos.js"></script>
</body>
</html>
