<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto | Orbe Supply</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="fornecedores">
  <div class="app">
    <aside class="lateral" id="menu"></aside>

    <main class="conteudo">
      <div class="cabecalho-pagina">
        <h1 id="titulo">Novo produto</h1>
      </div>

      <div id="mensagem" class="mensagem" hidden></div>

      <section class="cartao">
        <form id="form-produto" class="campos" novalidate>
          <label class="campo largo">Nome *
            <input type="text" id="nome" maxlength="150">
          </label>
          <label class="campo">Quantidade em estoque *
            <input type="number" id="quantidade_estoque" min="0" step="1">
          </label>
          <label class="campo">Preço (R$)
            <input type="number" id="preco" min="0" step="0.01">
          </label>
          <label class="campo largo">Lote
            <input type="text" id="lote" maxlength="30">
          </label>
          <label class="campo">Data de fabricação
            <input type="date" id="data_fabricacao">
          </label>
          <label class="campo">Data de vencimento
            <input type="date" id="data_vencimento">
          </label>
          <div class="linha-botoes">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao secundario" id="link-voltar" href="fornecedores.html">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/produto-form.js"></script>
</body>
</html>
